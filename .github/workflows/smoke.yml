name: Lightweight smoke test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-mac.lock.txt
      - run: python -m pip check
      - run: python scripts/smoke_test.py --output-dir results/ci-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-evidence
          path: results/ci-smoke/
          retention-days: 14
